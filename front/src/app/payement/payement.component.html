<div class="payment-container">
  <div class="payment-card">
    <div class="payment-left">
      <div class="payment-header">
        <h2 class="payment-title">First Payment</h2>
        <span class="payment-amount">$1,200.00</span>
      </div>
      <div class="payment-image">
        <img src="assets/pay.png" alt="Payment Illustration">
      </div>
    </div>
    <div class="payment-right">
      <div class="payment-progress">
        <div class="progress-line"></div>
        <div class="progress-dot"></div>
      </div>
      <form class="payment-form">
        <div class="form-group">
          <label for="cardNumber">CARD NUMBER</label>
          <input type="text" id="cardNumber" placeholder="">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="expiryDate">MM / YY</label>
            <input type="text" id="expiryDate" placeholder="">
          </div>
          <div class="form-group">
            <label for="cvc">CVC</label>
            <input type="text" id="cvc" placeholder="">
          </div>
        </div>
        <div class="form-group">
          <label for="cardholderName">CARDHOLDER NAME</label>
          <input type="text" id="cardholderName" placeholder="">
        </div>
        <button type="submit" class="pay-button">Pay</button>
      </form>
    </div>
  </div>
</div>
